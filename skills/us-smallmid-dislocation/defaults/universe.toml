[universe]
name = "broad-us-smallmid-synthetic"
target_count_nominal = 2800
target_count_soft_min = 2200
target_count_soft_max = 3200

[listing]
allowed_exchanges = ["NYSE", "NASDAQ", "NYSE American"]
country = "US"
security_type = "common_stock"

[filters]
market_cap_min_usd = 300000000
market_cap_max_usd = 20000000000
min_price_usd = 5.0
min_avg_dollar_volume_20d_usd = 2000000

excluded_structures = [
  "ETF",
  "ADR",
  "SPAC",
  "preferred",
  "warrant",
  "right",
  "closed_end_fund",
  "LP",
  "MLP",
]

excluded_industries = [
  "banks",
  "insurance",
  "reit",
  "bdc",
]

excluded_special_situations = [
  "recent_despac",
  "reverse_split",
  "pre_revenue_biotech",
  "precommercial_medtech",
  "strategic_review",
  "busted_deal",
]

[benchmarks]
small_cap = "IWM"
small_cap_alt = "IJR"
mid_cap = "IJH"
broad_market = "SPY"

[state_ceilings]
max_filing_age_days = 120
min_runway_months = 12
max_share_count_growth_yoy = 0.08
max_working_capital_release_ratio = 0.50

[notes]
universe_goal = "Approximate a broad Russell-like small/mid-cap opportunity set without requiring paid membership data."
count_rule = "Do not force an exact 2800-name result. Use the count as a practical target after hygiene filters."
quality_rule = "If the universe is too large, tighten liquidity first, then tighten the market-cap ceiling. If too small, loosen liquidity modestly before touching the market-cap floor."
relaxation_order = "Do not relax the price floor, structural exclusions, special-situation exclusions, or core binary-story gates just to hit the target count."
