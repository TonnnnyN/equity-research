[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sentiment"
version = "0.1.0"
description = "Local daily-close market sentiment pipeline for AI applications, compute, and power equities."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Codex" }
]
dependencies = []

[project.optional-dependencies]
social = ["twscrape>=0.17.0", "twikit>=2.3.3"]
social-x-twscrape = ["twscrape>=0.17.0"]
social-x-twikit = ["twikit>=2.3.3"]

[project.scripts]
market-sentiment = "market_sentiment.cli:main"

[tool.setuptools]
package-dir = {"" = "sharing-resources/src"}

[tool.setuptools.packages.find]
where = ["sharing-resources/src"]
