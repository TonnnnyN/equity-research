[project]
timezone = "Asia/Hong_Kong"
raw_data_dir = "data/raw"
report_dir = "data/reports"
db_path = "data/state/market_sentiment.sqlite3"
default_user_agent = "market-sentiment/0.1 (local research use)"

[triggers.ai_applications]
drawdown_10d = -0.08
drawdown_20d = -0.12
relative_20d = -0.06

[triggers.compute]
drawdown_10d = -0.12
drawdown_20d = -0.18
relative_20d = -0.08

[triggers.utilities]
drawdown_10d = -0.05
drawdown_20d = -0.08
relative_20d = -0.04

[triggers.pharma]
drawdown_10d = -0.06
drawdown_20d = -0.10
relative_20d = -0.05

[macro]
fred_series = ["DGS10", "DFF"]
eia_natural_gas_route = "/v2/natural-gas/pri/sum/data/"

[retention]
report_days = 90
raw_payload_days = 30
social_raw_payload_days = 30
daily_price_days = 365
official_event_days = 365
fundamental_days = 730
macro_days = 365
run_metadata_days = 90
social_post_days = 90
social_snapshot_days = 180

[social]
enabled = true
providers = ["reddit", "forum", "x"]
lookback_hours = 168
baseline_days = 14
max_posts_per_source = 150
min_recent_posts = 6
min_unique_authors = 5
min_platform_count = 1
max_author_share = 0.40
max_backfill_days = 21

[social.reddit]
enabled = true
subreddits = ["stocks", "investing", "wallstreetbets", "options", "SecurityAnalysis"]
max_posts_per_subreddit = 75

[social.forum]
enabled = false
base_urls = []
max_posts_per_forum = 50
# base_urls = ["https://meta.discourse.org", "https://community.fly.io"]

[social.x]
enabled = false
provider = "twscrape,twikit"
max_posts = 50
# db_path = "data/state/twscrape_accounts.db"
# cookies_path = "data/state/x_cookies.json"

[options]
enabled = false
provider = "alpha_vantage"
require_greeks = false
max_contracts = 80

