[project]
timezone = "Asia/Hong_Kong"
raw_data_dir = "data/raw"
report_dir = "data/reports"
db_path = "data/state/equity_research.sqlite3"
default_user_agent = "equity-research/0.1 (local research use)"

[thresholds.ai_applications]
ten_day_drawdown = 0.08
twenty_day_drawdown = 0.12
relative_underperformance = 0.06

[thresholds.compute]
ten_day_drawdown = 0.12
twenty_day_drawdown = 0.18
relative_underperformance = 0.08

[thresholds.utilities]
ten_day_drawdown = 0.05
twenty_day_drawdown = 0.08
relative_underperformance = 0.04

[thresholds.pharma]
ten_day_drawdown = 0.06
twenty_day_drawdown = 0.10
relative_underperformance = 0.05

[macro]
fred_series = ["DGS10", "DFF"]
eia_natural_gas_route = "/v2/natural-gas/pri/sum/data/"

[retention]
report_days = 90
raw_payload_days = 30
social_raw_payload_days = 30
daily_price_days = 1915
official_event_days = 365
fundamental_days = 730
macro_days = 365
run_metadata_days = 90
social_post_days = 90
social_snapshot_days = 180

[social]
enabled = true
providers = ["reddit", "forum", "x"]
lookback_hours = 168
baseline_days = 14
max_posts_per_source = 150
min_recent_posts = 6
min_unique_authors = 5
min_platform_count = 1
max_author_share = 0.40
max_backfill_days = 21

[social.reddit]
enabled = true
subreddits = ["stocks", "investing", "wallstreetbets", "options", "SecurityAnalysis"]
max_posts_per_subreddit = 75

[social.forum]
enabled = false
base_urls = []
max_posts_per_forum = 50

[social.x]
enabled = false
provider = "twscrape,twikit"
max_posts = 50

[options]
enabled = false
provider = "alpha_vantage"
require_greeks = false
max_contracts = 80

[[benchmarks]]
ticker = "QQQ"
name = "Invesco QQQ Trust"

[[benchmarks]]
ticker = "IWM"
name = "iShares Russell 2000 ETF"

[[benchmarks]]
ticker = "SOXX"
name = "iShares Semiconductor ETF"

[[benchmarks]]
ticker = "XLU"
name = "Utilities Select Sector SPDR Fund"

[[benchmarks]]
ticker = "PPH"
name = "VanEck Pharmaceutical ETF"

[[benchmarks]]
ticker = "3033.HK"
name = "CSOP Hang Seng TECH Index ETF"
